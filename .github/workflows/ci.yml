name: AegisX validation

on:
  push:
  pull_request:

jobs:
  cpp:
    name: ${{ matrix.compiler }} ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cxx: g++
            build_type: Debug
          - compiler: gcc
            cxx: g++
            build_type: Release
          - compiler: clang
            cxx: clang++
            build_type: Debug
          - compiler: clang
            cxx: clang++
            build_type: Release
    steps:
      - uses: actions/checkout@v5
      - name: Configure offline tree
        run: cmake -S . -B build/${{ matrix.compiler }}-${{ matrix.build_type }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build with warnings as errors
        run: cmake --build build/${{ matrix.compiler }}-${{ matrix.build_type }} --parallel
      - name: C++ tests and deterministic fixture smoke test
        run: ctest --test-dir build/${{ matrix.compiler }}-${{ matrix.build_type }} --output-on-failure

  sanitizers:
    name: gcc ASan UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build/sanitizers -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Debug -DAEGISX_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build/sanitizers --parallel
      - name: Run with sanitizer failures enabled
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build/sanitizers --output-on-failure

  static-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Enforce C++ formatting
        run: find cpp -type f \( -name '*.cpp' -o -name '*.h' \) -print0 | xargs -0 clang-format --dry-run --Werror
      - name: Configure clang-tidy build
        run: cmake -S . -B build/tidy -DCMAKE_CXX_COMPILER=clang++ -DAEGISX_ENABLE_CLANG_TIDY=ON
      - name: Build with clang-tidy diagnostics treated as errors
        run: cmake --build build/tidy --parallel

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install research and dashboard dependencies
        run: python -m pip install --upgrade pip && python -m pip install ./python pytest
      - name: Test research and portfolio analytics
        run: python -m pytest python/tests -q
      - name: Dashboard syntax smoke test
        run: python -m compileall -q dashboard python/aegisx_research python/scripts
