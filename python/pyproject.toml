[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisx-research"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scikit-learn", "pyarrow", "duckdb", "streamlit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
